<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#FFF5FA;--surface:#FFFFFF;--surface2:#FFE8F3;--ink:#3A1029;--on-ink:#FFFFFF;--muted:#74506A;--sand:#FFE3F0;
  --deep:#FF8CC6;--card-fg:#3A1029;--card-muted:#5C1D45;--card-track:rgba(58,16,41,0.16);--card-line:rgba(58,16,41,0.4);--card-cur:#FFFFFF;
  --seg-essay:#3A1029;--seg-news:#1E6E52;--seg-short:#2E7A1C;
  --accent:#FF7EB9;--on-accent:#3A1029;--accent-fg:#C21F6E;--accent-tint:rgba(255,126,185,0.22);--check:#D6287A;
  --essay:#D6287A;--news:#1E7A5A;--short:#7EDB5C;--short-ink:#2E7A1C;--channel:#74506A;--link:#C21F6E;--info-bg:#FFE3F0;--field:#FFFFFF;
  --warn-bg:#FFE9D6;--warn-fg:#8A3B00;--line-rgb:58,16,41;--scrim:rgba(58,16,41,0.45);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1C0A15;--surface:#2A1222;--surface2:#220E1B;--ink:#FFEAF4;--on-ink:#1C0A15;--muted:#CDA7BD;--sand:#3A1830;
  --deep:#5A1A43;--card-fg:#FFF0F7;--card-muted:#F5C6DE;--card-track:rgba(255,240,247,0.2);--card-line:rgba(255,240,247,0.42);--card-cur:rgba(255,240,247,0.85);
  --seg-essay:#FF9CCB;--seg-news:#4FCF9E;--seg-short:#8CE46C;
  --accent:#C93D86;--on-accent:#FFFFFF;--accent-fg:#FF9CCB;--accent-tint:rgba(255,126,185,0.16);--check:#C93D86;
  --essay:#C93D86;--news:#1C7F5B;--short:#86E06A;--short-ink:#9BEA80;--channel:#CDA7BD;--link:#FF9CCB;--info-bg:#3D1733;--field:#2A1222;
  --warn-bg:#4A2410;--warn-fg:#FFC59A;--line-rgb:255,234,244;--scrim:rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.main{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;position:relative}
.wrap{padding:14px 20px 104px;display:flex;flex-direction:column;gap:20px;max-width:1100px;margin:0 auto}
.panes{display:flex;flex-direction:column;min-height:100%}
.pane-list{display:flex;flex-direction:column;gap:16px;padding:14px 0 104px}
.pane-list>*{margin-left:20px;margin-right:20px;flex:none}
.pane-list>.chips{margin:0;padding:0 20px 2px}
.pane-detail{display:none}
.pane-detail>*{flex:none}
.cols{display:flex;flex-direction:column;gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
/* nav */
.nav{order:2;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface2);border-top:1px solid rgba(var(--line-rgb),.14);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .rail-top{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;text-decoration:none;color:var(--muted);font-size:11px;line-height:1;border-radius:16px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent-fg);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.2}
.fab{position:fixed;right:18px;bottom:calc(94px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(58,16,41,.3);cursor:pointer;z-index:5}
.fab svg,.railadd svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
@media (min-width:600px){
  .app{flex-direction:row}
  .nav{order:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;border-top:0;border-right:1px solid rgba(var(--line-rgb),.14)}
  .nav .rail-top{display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:12px}
  .tab{width:72px;min-height:60px}
  .tab[aria-current="page"]{background:var(--accent-tint)}
  .railadd{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fab{display:none}
  .wrap{padding:24px 32px 32px}
  .panes{flex-direction:row;height:100%;min-height:0}
  .pane-list{flex:none;width:370px;overflow-y:auto;padding:14px 0 28px;border-right:1px solid rgba(var(--line-rgb),.14)}
  .pane-detail{display:flex;flex:1 1 auto;min-width:0;overflow-y:auto;flex-direction:column;gap:16px;padding:28px 28px 32px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
  .only-narrow{display:none!important}
}
@media (max-width:599px){.only-wide{display:none!important}.steps em{visibility:hidden}.steps .on em{visibility:visible;overflow:visible}}
/* type */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.01em}
@media (min-width:600px){h1{font-size:40px}}
h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15}
h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.gh{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.sub{color:var(--muted);font-size:14px}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;display:inline-block}
.d-essay{background:var(--essay)}.d-news{background:var(--news)}.d-short{background:var(--short)}.d-channel{background:var(--channel)}
/* cards */
.card{background:var(--surface);border:1px solid rgba(var(--line-rgb),.12);border-radius:16px}
.pad{padding:14px 16px}
.list{background:var(--surface);border:1px solid rgba(var(--line-rgb),.12);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid rgba(var(--line-rgb),.1)}
.feature{background:var(--deep);color:var(--card-fg);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;text-decoration:none}
.feature .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--card-muted);display:flex;justify-content:space-between;gap:8px}
.feature .m{font-size:13px;color:var(--card-muted)}
.segs{display:grid;gap:4px}
.segs i{display:block;height:6px;border-radius:3px;background:var(--card-track)}
.notice{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--info-bg);display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn-fg)}
.empty{border:1.5px dashed rgba(var(--line-rgb),.3);border-radius:16px;padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}
/* buttons */
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:15px}
.btn.quiet{background:var(--surface);color:var(--ink);border:1px solid rgba(var(--line-rgb),.25)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.dashed{background:transparent;border:1.5px dashed var(--short-ink);color:var(--short-ink);width:100%}
.linkbtn{background:none;border:0;padding:0 4px;min-height:44px;color:var(--link);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(var(--line-rgb),.2);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap}
.chips.wrapr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid rgba(var(--line-rgb),.18)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.75}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--sand)}
.seg button{min-height:40px;border:0;border-radius:10px;cursor:pointer;font-size:14px;background:transparent;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(58,16,41,.12)}
/* tasks */
.task{display:flex;align-items:center;gap:4px;padding:4px 14px 4px 4px}
.check{flex:none;width:48px;height:48px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ring{width:24px;height:24px;border-radius:50%;border:2px solid rgba(var(--line-rgb),.4);display:flex;align-items:center;justify-content:center}
.ring svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;display:none}
.task.done .ring{background:var(--check);border-color:var(--check)}
.task.done .ring svg{display:block}
.task .body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;padding:8px 0;color:var(--ink);text-decoration:none}
.task .t{font-weight:500;line-height:1.3}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--sand);color:var(--ink)}
.tag.film{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag.live{background:var(--ink);color:var(--on-ink)}
.tag.late{background:var(--warn-bg);color:var(--warn-fg)}
/* rows */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--ink);text-decoration:none;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font-size:15px}
.item[aria-current="true"]{background:var(--info-bg)}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t{font-weight:600;line-height:1.25}
.thumb{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;font-weight:800;color:#fff}
.thumb.essay{background:var(--essay)}.thumb.news{background:var(--news)}
.thumb.past{opacity:.6}
.datetile{flex:none;width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--sand);color:var(--ink)}
.datetile .w{font-size:10px;font-family:var(--f-mono)}.datetile .n{font-size:17px;font-weight:700}
.datetile.essay{background:var(--essay);color:#fff}.datetile.news{background:var(--news);color:#fff}.datetile.short{background:var(--short);color:#1F2A12}
.vtile{flex:none;width:40px;height:54px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em}
.vtile b{font-family:var(--f-body);font-size:15px}
.vtile.fill{background:var(--short);color:#1F2A12}.vtile.wait{background:var(--sand);color:var(--ink)}.vtile.open{border:1.5px dashed var(--short-ink);color:var(--short-ink)}
.bar{height:4px;border-radius:2px;background:var(--bg);display:block;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.steps{display:grid;gap:4px}
.steps span{display:flex;flex-direction:column;gap:4px;min-width:0}
.steps i{display:block;height:6px;border-radius:3px;background:rgba(var(--line-rgb),.15)}
.steps em{font-style:normal;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.steps .on em{color:var(--ink);font-weight:600}
.pill{padding:2px 8px;border-radius:6px;font-weight:600;font-size:12px;box-shadow:inset 0 0 0 1.5px rgba(var(--line-rgb),.3);color:var(--muted)}
.pill.scheduled,.pill.posted{box-shadow:none;background:var(--short);color:#1F2A12}
.pill.editing,.pill.filmed{box-shadow:inset 0 0 0 1.5px var(--short-ink);color:var(--short-ink)}
.pill.waiting{box-shadow:inset 0 0 0 1.5px var(--news);color:var(--news)}
:root[data-theme="dark"] .pill.waiting{color:#7FE0B8;box-shadow:inset 0 0 0 1.5px #4FCF9E}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:var(--surface);border:0;cursor:pointer;color:var(--ink)}
.wd .l{font-size:11px;font-family:var(--f-mono)}.wd .n{font-size:16px;font-weight:600}
.wd .dots{display:flex;gap:3px;height:6px}.wd .dots i{width:6px;height:6px;border-radius:50%}
.wd[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.wd.now:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--accent-fg)}
/* calendar */
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{min-height:60px;padding:5px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid rgba(var(--line-rgb),.1);color:var(--ink)}
.cell.out{background:transparent;color:var(--muted)}
.cell[aria-pressed="true"]{background:var(--info-bg);border:2px solid var(--accent-fg)}
.cell.film{border:1.5px dashed var(--ink)}
.cell .num{font-size:13px;font-weight:600;line-height:1;padding:3px 2px}
.cell.now .num{background:var(--ink);color:var(--on-ink);border-radius:9px;padding:3px 6px}
.cell .pl{align-self:stretch;text-align:center;border-radius:4px;padding:1px 0;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;font-weight:500;color:#fff}
.cell .mk{display:flex;gap:3px;align-items:center;flex-wrap:wrap;min-height:6px}
.cell .mk i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{min-height:48px;width:100%;padding:0 14px;border-radius:12px;border:1px solid rgba(var(--line-rgb),.25);background:var(--field);color:var(--ink);font-size:15px;font-weight:400}
.field textarea{padding:12px 14px;min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cbrow{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 14px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;font-size:15px}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid rgba(var(--line-rgb),.35);display:flex;align-items:center;justify-content:center}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none;display:none}
.cbrow[aria-pressed="true"] .box{background:var(--check);border-color:var(--check)}
.cbrow[aria-pressed="true"] .box svg{display:block}
.cbrow[aria-pressed="true"] .lbl{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{width:34px;height:34px}
.signin{max-width:440px;padding-top:max(48px,env(safe-area-inset-top,0px));gap:16px}
.sihead{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sihead .logo{width:48px;height:48px}
body.gate .nav,body.gate .fab{display:none}
.wrap{padding-top:max(14px,env(safe-area-inset-top,0px))}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--news);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main" id="nav"></nav>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<button class="fab" type="button" data-act="add" aria-label="Quick add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="vendor/supabase-2.45.4.js"></script>
<script>
(function(){
'use strict';
/* ---------- state ---------- */
var S={db:null,dbState:'loading',videos:{},shorts:{},ideas:{},stories:{},tasks:{},checks:{},settings:null,
  ui:{day:null,month:null,calSel:null,vidShow:'all',vidSel:null,vidTab:'schedule',shortSrc:'all',shortSel:null,ideaKind:'all',ideaSel:null,sheet:null}};
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];
var SHOW={essay:'Video essay',news:'News roundup',short:'Shorts',channel:'Channel'};
var STATUS=[['planned','Planned'],['to-film','To film'],['filmed','Filmed'],['editing','In edit'],['scheduled','Scheduled'],['posted','Posted'],['waiting','Waiting on long-form']];
var STATUS_NAME={};STATUS.forEach(function(s){STATUS_NAME[s[0]]=s[1];});
var KIND={essay:'Video essay',news:'News segment',short:'Short',cosplay:'Cosplay'};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function today(){return ds(new Date());}
function dow(s){return pd(s).getDay();}
function fmt(s,noDow){if(!s)return '';var d=pd(s);return (noDow?'':DOW[d.getDay()]+', ')+MON[d.getMonth()]+' '+d.getDate();}
function between(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function mondayOf(s){var d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d);}
function vals(o){return Object.keys(o).map(function(k){return o[k];});}
function shiftM(key,n){var p=key.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monthKey(s){return s.slice(0,7);}
function monthName(key,short){var p=key.split('-');return (short?MON:MONTH)[+p[1]-1]+(short?'':' '+p[0]);}
function firstFri(key){var p=key.split('-');var d=new Date(+p[0],+p[1]-1,1);d.setDate(1+((5-d.getDay()+7)%7));return ds(d);}
function W1(key){return addD(firstFri(key),-4);} /* Monday of week 1 */
function prodMonth(d){var k=monthKey(d);if(d<W1(k))k=shiftM(k,-1);if(d>=W1(shiftM(k,1)))k=shiftM(k,1);return k;}
function weekOf(d){var k=prodMonth(d),w=Math.floor(between(W1(k),d)/7)+1,nx=W1(shiftM(k,1));if(d>=addD(nx,-7))w=4;else if(w>=4)w=5;return {month:k,week:w};}
function svg(d,c){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(c?' class="'+c+'"':'')+'><path d="'+d+'"/></svg>';}
var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
var CHEV='M9 6l6 6-6 6', BACK='M15 5l-7 7 7 7';
function sett(){var s=S.settings||{};return {creator:s.creator||'Anna',deskStart:s.deskStart||'2026-11-02',queueStart:s.queueStart||'2026-11-07',shortsNightStart:s.shortsNightStart||'2026-11-14',fullStart:s.fullStart||'2026-11-29',shortDays:s.shortDays||[0,2,4,6],holidays:s.holidays||{},hours:s.hours||{0:0.5,1:2,2:2,3:4.5,4:4.5,5:2,6:4.5},questions:s.questions||[],answers:s.answers||{}};}
function hrs(m){if(!m)return '0 h';var h=Math.round(m/30)/2;return (h<1?Math.round(m)+' min':h+' h');}

/* ---------- schedule engine ---------- */
var CACHE=null;
function stepsFor(v){
  var out=[],list,base,rel,sh;
  if(v.show==='news'){
    base=addD(W1(v.month),4);rel=v.release||base;list=v.flow==='current'?NEWS_CUR:NEWS_STEPS;
    list.forEach(function(s){out.push(mkStep(v,s,addD(rel,s.o)));});
  }else{
    var A=W1(shiftM(v.month,-1)),B=W1(v.month),C=W1(shiftM(v.month,-2));
    base=addD(B,19);rel=v.release||base;sh=between(base,rel);list=v.flow==='current'?ESSAY_CUR:ESSAY_STEPS;
    list.forEach(function(s){var d=s.f==='A'?addD(A,s.o):s.f==='B'?addD(B,s.o):addD(C,s.o+(v.long?-14:0));out.push(mkStep(v,s,addD(d,sh)));});
  }
  var ov=v.over||{};
  return out.filter(function(st){var o=ov[st.k];if(o==='skip')return false;if(o)st.date=o;return true;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
function mkStep(v,s,d){return {k:s.k,t:s.t,label:s.label||'',m:s.m,film:!!s.film,live:!!s.live,gate:!!s.gate,date:d,v:v,done:!!(v.done||{})[s.k],key:'step:'+v.id+':'+s.k};}
function build(){
  var idx={},byVid={};
  vals(S.videos).forEach(function(v){var st=stepsFor(v);byVid[v.id]=st;st.forEach(function(s){(idx[s.date]=idx[s.date]||[]).push(s);});});
  CACHE={idx:idx,byVid:byVid};
}
function steps(v){return CACHE.byVid[v.id]||[];}
function releaseOf(v){var l=steps(v).filter(function(s){return s.k==='live';})[0];return l?l.date:(v.release||'');}
function milestones(v){return steps(v).filter(function(s){return s.label;});}
function nextStep(v){return milestones(v).filter(function(s){return !s.done;})[0]||null;}
function lateSteps(v,d){return milestones(v).filter(function(s){return !s.done&&s.date<d;});}
function videos(){return vals(S.videos).sort(function(a,b){var x=releaseOf(a),y=releaseOf(b);return x<y?-1:x>y?1:0;});}
function vName(v){return v?(v.title||(SHOW[v.show]+' · '+fmt(releaseOf(v),true))):'';}
function deskVideo(d){return videos().filter(function(v){if(v.show!=='news'||v.flow==='current')return false;var desk=steps(v).filter(function(s){return s.k==='desk';})[0];return desk?desk.date>=d:releaseOf(v)>d;})[0]||null;}
function videoFor(month,show){return vals(S.videos).filter(function(v){return v.month===month&&v.show===show;})[0]||null;}
function rt(d,name,t,show,vid,m,extra){var key='chk:'+d+'_'+name;var o={key:key,t:t,show:show,vid:vid||'',m:m,done:!!(S.checks[d+'_'+name]||{}).done,kind:'routine',name:name};if(extra)for(var k in extra)o[k]=extra[k];return o;}
function itemsFor(d){
  var set=sett(),st=(CACHE.idx[d]||[]),dw=dow(d),it=[];
  st.forEach(function(s){it.push({key:s.key,t:s.t,show:s.v.show,vid:s.v.id,m:s.m,film:s.film,live:s.live,gate:s.gate,label:s.label,done:s.done,kind:'step',k:s.k});});
  vals(S.tasks).filter(function(t){return t.day===d;}).sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(t){it.push({key:'task:'+t.id,t:t.title,show:t.show||'channel',vid:t.video||'',m:t.mins||0,done:!!t.done,kind:'task',id:t.id,film:!!t.film,live:!!t.live,note:t.note||''});});
  var vidSteps=st.length>0, film=it.some(function(x){return x.film;}), essayLive=st.some(function(s){return s.live&&s.v.show==='essay';})||it.some(function(x){return x.live&&x.show==='essay';}), rough=st.some(function(s){return s.k==='rough';});
  if(dw===6){
    if(d>=set.shortsNightStart&&!film&&!essayLive)it.push(rt(d,'shortsfilm','Film 4 standalone shorts in one setup (evening)','short','',120,{film:true}));
    if(d>=set.queueStart&&!rough)it.push(rt(d,'queue','Shorts queue: edit, schedule and cross-post to TikTok and Reels','short','',120));
  }
  if(d>=set.fullStart&&!set.holidays[d]){
    if(dw===5&&!vidSteps)it.push(rt(d,'cuts','Cut-down shorts: reframe, caption, schedule','short','',120));
    if(dw>=1&&dw<=4&&!vidSteps)it.push(rt(d,'catchup','Catch-up: film extra shorts or research the essay after next','channel','',120));
  }
  if(dw>=1&&dw<=6&&d>=set.deskStart){var nv=deskVideo(d);it.push(rt(d,'desk','News desk, 15 min: save stories with a link and one line on why they matter','news',nv?nv.id:'',15));}
  if(dw===0)it.push(rt(d,'review','Sunday review, 30 min','channel','',30,{review:true}));
  return it;
}
function slotDays(a,b){var set=sett(),out=[];for(var d=a;d<=b;d=addD(d,1))if(set.shortDays.indexOf(dow(d))>=0)out.push(d);return out;}
function shortsOn(d){return vals(S.shorts).filter(function(s){return s.date===d;});}
function nextOpenSlot(from){for(var i=0;i<120;i++){var d=addD(from,i);if(sett().shortDays.indexOf(dow(d))>=0&&!shortsOn(d).length)return d;}return from;}
function queueDays(d){var n=0;for(var i=0;i<14;i++){var x=addD(d,i);if(sett().shortDays.indexOf(dow(x))<0)continue;var ok=shortsOn(x).some(function(s){return s.status==='scheduled'||s.status==='posted';});if(!ok)break;n=i+1;}return n;}

/* ---------- data (Supabase) ---------- */
var SB_URL='__SB_URL__', SB_KEY='__SB_KEY__';
var COLS=['videos','shorts','ideas','stories','tasks','checks'], CACHE_KEY='sbm-cache-v1', OUT_KEY='sbm-outbox-v1', sb=null, chan=null, rT=null;
S.session=null; S.signin={email:'',sent:false,busy:false,msg:'',mode:null}; S.cachedAt=null; S.outbox=[]; S.saveErr=false;
/* Changes are saved on the phone first (the outbox), then sent to Supabase in order and retried until they land. */
function jm(a,b){if(!a||typeof a!=='object'||Array.isArray(a)||!b||typeof b!=='object'||Array.isArray(b))return b;var r=Object.assign({},a);Object.keys(b).forEach(function(k){r[k]=jm(r[k],b[k]);});return r;}
function timed(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej({timeout:true,message:'timeout'});},ms);})]);}
function applyRow(r){
  if(!r||!r.col)return;
  if(r.col==='config'){if(r.id==='settings')S.settings=r.data||null;return;}
  if(COLS.indexOf(r.col)<0)return;
  var v=Object.assign({},r.data);v.id=r.id;S[r.col][r.id]=v;
}
function applyOp(o){
  if(o.col==='config'){if(o.id==='settings')S.settings=o.k==='insert'?o.data:jm(S.settings||{},o.patch);return;}
  if(!S[o.col])return;
  if(o.k==='insert'){var v=Object.assign({},o.data);v.id=o.id;S[o.col][o.id]=v;}
  else if(o.k==='delete'){delete S[o.col][o.id];}
  else if(S[o.col][o.id]){var m=jm(S[o.col][o.id],o.patch);m.id=o.id;S[o.col][o.id]=m;}
}
function reapply(col,id){S.outbox.forEach(function(o){if(!col||(o.col===col&&o.id===id))applyOp(o);});}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function saveOut(){lsSet(OUT_KEY,JSON.stringify(S.outbox));}
function loadOut(){try{S.outbox=JSON.parse(lsGet(OUT_KEY,'[]'))||[];}catch(e){S.outbox=[];}}
function saveCache(){try{var c={at:new Date().toISOString(),settings:S.settings};COLS.forEach(function(k){c[k]=S[k];});lsSet(CACHE_KEY,JSON.stringify(c));}catch(e){}}
function loadCache(){try{var c=JSON.parse(lsGet(CACHE_KEY,'null'));if(!c)return false;COLS.forEach(function(k){S[k]=c[k]||{};});S.settings=c.settings||null;S.cachedAt=c.at;return true;}catch(e){return false;}}
function soon(){clearTimeout(rT);rT=setTimeout(render,120);}
var loading=null;
function loadAll(){
  if(loading)return loading;
  loading=(async function(){
    var all=[],from=0;
    while(true){var res=await timed(sb.from('items').select('col,id,data').order('col').order('id').range(from,from+999),20000);if(res.error)throw res.error;all=all.concat(res.data);if(res.data.length<1000)break;from+=1000;}
    if(!all.length){var m=await timed(sb.rpc('sbm_is_member'),15000);if(!m.error&&m.data===false){S.dbState='denied';render();return;}}
    COLS.forEach(function(k){S[k]={};});S.settings=null;all.forEach(applyRow);
    reapply();
    S.dbState='ready';S.cachedAt=null;saveCache();render();
  })().finally(function(){loading=null;});
  return loading;
}
var connecting=null;
function connect(){
  if(connecting)return connecting;
  connecting=(async function(){
    if(!S.cachedAt)S.dbState='loading';
    render();
    try{await loadAll();}catch(e){S.dbState=navigator.onLine===false?'offline':(S.cachedAt?'stale':'error');render();retryLoadLater();flush();return;}
    flush();
    if(chan)return;
    chan=sb.channel('sbm-items').on('postgres_changes',{event:'*',schema:'public',table:'items'},function(p){
      if(p.eventType==='DELETE'){var o=p.old||{};if(o.col&&S[o.col])delete S[o.col][o.id];}
      else{applyRow(p.new);if(p.new)reapply(p.new.col,p.new.id);}
      saveCache();soon();
    }).subscribe();
  })().finally(function(){connecting=null;});
  return connecting;
}
var loadRetryT=null;
function retryLoadLater(){clearTimeout(loadRetryT);loadRetryT=setTimeout(function(){if(sb&&S.session&&S.dbState!=='ready'&&S.dbState!=='denied')connect();},8000);}
var flushing=false,flushT=null,flushWait=3000;
function isNetErr(e){return !e||e.timeout||navigator.onLine===false||/fetch|network|load failed|timeout/i.test(String(e.message||e))||!e.code;}
async function flush(){
  if(flushing||!sb||!S.session||!S.outbox.length)return;
  flushing=true;clearTimeout(flushT);
  try{
    while(S.outbox.length){
      var o=S.outbox[0],r;
      try{
        r=o.k==='insert'
          ?await timed(sb.from('items').upsert({col:o.col,id:o.id,data:o.data},{onConflict:'col,id'}),15000)
          :o.k==='delete'
          ?await timed(sb.from('items').delete().eq('col',o.col).eq('id',o.id),15000)
          :await timed(sb.rpc('sbm_merge',{p_col:o.col,p_id:o.id,p_patch:o.patch}),15000);
        if(r.error)throw r.error;
      }catch(e){
        if(isNetErr(e)){S.saveErr=true;render();flushT=setTimeout(flush,flushWait);flushWait=Math.min(flushWait*2,60000);return;}
        console.warn('Dropped a change the server refused',o,e);toast('One change couldn’t be saved: '+(e.message||'refused')+'.');
      }
      S.outbox.shift();saveOut();
    }
    S.saveErr=false;flushWait=3000;if(S.dbState==='stale'||S.dbState==='error')setTimeout(connect,0);render();
  }finally{flushing=false;}
}
function queueOp(o){S.outbox.push(o);saveOut();applyOp(o);saveCache();render();flush();}
function canSave(){if(!sb||!S.session){toast('Sign in to save changes.');return false;}return true;}
function split(path){var i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)];}
function write(path,patch,ok){if(!canSave())return Promise.resolve();var p=split(path);queueOp({k:'merge',col:p[0],id:p[1],patch:patch,at:Date.now()});if(ok)toast(ok);return Promise.resolve();}
function put(path,data,ok){if(!canSave())return Promise.resolve();var p=split(path);queueOp({k:'insert',col:p[0],id:p[1],data:data,at:Date.now()});if(ok)toast(ok);return Promise.resolve();}
function create(col,data,ok){if(!canSave())return Promise.resolve();var id=col.charAt(0)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);queueOp({k:'insert',col:col,id:id,data:data,at:Date.now()});if(ok)toast(ok);return Promise.resolve({id:id});}
function remove(path,ok){if(!canSave())return Promise.resolve();var p=split(path);queueOp({k:'delete',col:p[0],id:p[1],at:Date.now()});if(ok)toast(ok);return Promise.resolve();}
async function start(){
  loadOut();
  if(loadCache()){S.dbState='cached';reapply();}
  if(!window.supabase||SB_URL.indexOf('__')===0){S.dbState=S.cachedAt?'offline':'error';render();return;}
  /* A pass-through lock: the browser lock in supabase-js can stall on Android and freeze every request. */
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock:function(name,timeout,fn){return fn();}}});
  sb.auth.onAuthStateChange(function(ev,session){
    var had=!!S.session;S.session=session;if(session&&had&&ev==='USER_UPDATED')render();
    /* Never call Supabase inside this callback; defer it. */
    if(session&&!had){S.signin={email:'',sent:false,busy:false,msg:'',mode:S.signin.mode};setTimeout(connect,0);}
    if(!session&&ev==='SIGNED_OUT'){S.dbState='signedout';render();}
  });
  var g=await sb.auth.getSession();var s=g.data&&g.data.session;
  if(s){S.session=s;connect();}else if(!S.session){S.dbState='signedout';render();}
}
document.addEventListener('visibilitychange',function(){
  if(!sb||!S.session||S.dbState==='denied')return;
  if(document.visibilityState==='visible'){flush();loadAll().catch(function(){});}else flush();
});
window.addEventListener('online',function(){if(sb&&S.session){flushWait=3000;flush();connect();}});
window.addEventListener('offline',function(){if(S.dbState==='ready'){S.dbState='offline';render();}});

/* ---------- sign-in ---------- */
function siMode(){return S.signin.mode||lsGet('sbm-signinMode','password');}
async function sendLink(email){
  S.signin.busy=true;S.signin.msg='';render();
  var r=await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
  S.signin.busy=false;
  if(r.error)S.signin.msg=/rate/i.test(r.error.message||'')?'Too many requests. Wait a minute, then try again.':'That didn’t send. Check the address and your connection, then try again.';
  else{S.signin.email=email;S.signin.sent=true;}
  render();
}
async function verifyCode(code){
  S.signin.busy=true;S.signin.msg='';render();
  var r=await sb.auth.verifyOtp({email:S.signin.email,token:code,type:'email'});
  S.signin.busy=false;
  if(r.error){S.signin.msg='That code didn’t work. Check it, or send a new one.';render();}
}
async function signInPassword(email,pw){
  S.signin.busy=true;S.signin.msg='';S.signin.email=email;render();
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  S.signin.busy=false;
  if(r.error){S.signin.msg=/invalid/i.test(r.error.message||'')?'That email and password don’t match. Use the temporary password Rian sent you, or sign in with an email link.':(/rate/i.test(r.error.message||'')?'Too many tries. Wait a minute, then try again.':'Couldn’t sign in. Check your connection and try again.');render();return;}
  lsSet('sbm-signinMode','password');
}
async function setPassword(p1){

function openSheet(kind,ctx){S.ui.sheet={kind:kind,ctx:ctx||{}};renderSheet();var f=document.querySelector('#sheet input,#sheet select');if(f)f.focus();}
function closeSheet(){S.ui.sheet=null;renderSheet();}
function renderSheet(){
  var el=document.getElementById('sheet'),s=S.ui.sheet;if(!s){el.innerHTML='';return;}
  var inner='';
  if(s.kind==='add')inner=sheetAdd(s.ctx.type||'task',s.ctx);
  else if(s.kind==='editvid')inner=sheetEditVideo(S.videos[s.ctx.id]);
  else if(s.kind==='editshort')inner=sheetEditShort(S.shorts[s.ctx.id]);
  else if(s.kind==='greenlight')inner=sheetGreenlight(S.ideas[s.ctx.id]);
  else if(s.kind==='review')inner=sheetReview(s.ctx.day);
  else if(s.kind==='account')inner=sheetAccount();
  else if(s.kind==='shortview'){var sv=S.shorts[s.ctx.id];inner='<div class="between" style="align-items:center"><button class="linkbtn" type="button" data-act="close">Close</button><span></span></div>'+(sv?shortDetail(sv):'<div class="empty">This short was deleted.</div>');}
  el.innerHTML='<div class="scrim" data-act="scrim"><form class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(s.kind)+'" data-form="'+esc(s.kind)+'">'+inner+'</form></div>';
}
function submitSheet(form){
  var s=S.ui.sheet,fd=new FormData(form),g=function(k){var v=fd.get(k);return v==null?'':String(v).trim();};
  if(s.kind==='add'){var t=s.ctx.type||'task',now=today();
    if(t==='task')create('tasks',{title:g('title'),day:g('day')||now,mins:+g('mins')||0,show:g('show')||'channel',video:g('video'),done:false},'Task added');
    else if(t==='idea')create('ideas',{title:g('title'),kind:g('kind'),note:g('note'),added:now,used:false},'Idea saved');
    else if(t==='story')create('stories',{title:g('title'),url:g('url'),why:g('why'),segment:g('segment'),video:g('video'),added:now},'Story saved to the desk');
    else if(t==='short')create('shorts',{title:g('title'),date:g('date'),src:'solo',kind:g('kind'),status:g('status')||'to-film',hook:g('hook'),video:'',plat:{yt:true,tt:true,ig:true},chk:{}},'Short added');
    else if(t==='moment'){var vid=g('video'),v=S.videos[vid],n=vals(S.shorts).filter(function(x){return x.video===vid;}).length;create('shorts',{title:g('title'),date:g('date')||nextOpenSlot(today()),src:'cut',kind:n===0&&v&&v.show==='essay'?'teaser':'cut',video:vid,inT:g('inT'),outT:g('outT'),hook:g('hook'),status:v&&releaseOf(v)>today()?'waiting':'planned',plat:{yt:true,tt:true,ig:true},chk:{}},'Moment saved as a short');}
  }else if(s.kind==='editvid'){var v2=S.videos[s.ctx.id],rel=g('release'),patch={title:g('title'),scriptUrl:g('scriptUrl'),notes:g('notes')};
    if(v2.show==='essay'){patch.long=g('long')==='1';patch.thesis=g('thesis');}
    var base=v2.show==='news'?addD(W1(v2.month),4):addD(W1(v2.month),19);patch.release=rel&&rel!==base?rel:'';
    write('videos/'+v2.id,patch,'Saved');
  }else if(s.kind==='editshort'){write('shorts/'+s.ctx.id,{title:g('title'),date:g('date'),status:g('status'),hook:g('hook'),inT:g('inT'),outT:g('outT')},'Saved');}
  closeSheet();
}

/* ---------- render ---------- */
function render(){
  var el=document.getElementById('view'),need=S.dbState!=='signedout'&&mustChange(),gate=need||S.dbState==='signedout'||S.dbState==='denied'||(S.dbState==='error'&&!sb&&!S.cachedAt);
  document.body.classList.toggle('gate',gate);
  if(gate){document.getElementById('nav').innerHTML='';var html=need?viewNewPassword():S.dbState==='denied'?viewDenied():viewSignIn();if(el.getAttribute('data-gate')!==html){el.innerHTML=html;el.setAttribute('data-gate',html);}return;}
  el.removeAttribute('data-gate');
  build();
  var r=route(),h;
  renderNav(r.v);
  if(r.v==='today')h=viewToday();else if(r.v==='month')h=viewMonth();else if(r.v==='videos')h=viewVideos();else if(r.v==='video')h=viewVideo(r.id);else if(r.v==='shorts')h=viewShorts();else h=viewIdeas();
  var y=el.scrollTop;el.innerHTML=h;el.scrollTop=y;
  if(S.ui.sheet&&(S.ui.sheet.kind==='review'||S.ui.sheet.kind==='shortview'))renderSheet();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),k=t.getAttribute('data-k'),id=t.getAttribute('data-id');
  if(a==='scrim'){if(e.target===t)closeSheet();return;}
  if(a==='close'){closeSheet();return;}
  if(a==='add'){e.preventDefault();openSheet('add',{type:k||(route().v==='shorts'?'short':route().v==='ideas'?'idea':'task'),id:id,day:t.getAttribute('data-day')});return;}
  if(a==='addtype'){var c=S.ui.sheet.ctx;c.type=k;renderSheet();return;}
  if(a==='toggle'){toggleKey(k);return;}
  if(a==='deltask'){remove('tasks/'+id,'Task deleted');return;}
  if(a==='setday'){S.ui.day=k;render();return;}
  if(a==='shiftday'){S.ui.day=addD(S.ui.day||today(),+k);render();return;}
  if(a==='theme'){try{localStorage.setItem('sbm-theme',theme()==='dark'?'light':'dark');}catch(err){}applyTheme();render();return;}
  if(a==='gomonth'){S.ui.month=k;S.ui.calSel=null;return;}
  if(a==='calmonth'){S.ui.month=shiftM(S.ui.month||relMonth(S.ui.day||today()),+k);S.ui.calSel=null;render();return;}
  if(a==='calsel'){S.ui.calSel=k;render();return;}
  if(a==='openday'){S.ui.day=k;location.hash='#today';return;}
  if(a==='vidshow'){S.ui.vidShow=k;render();return;}
  if(a==='vidsel'){S.ui.vidSel=id;render();return;}
  if(a==='vidtab'){S.ui.vidTab=k;render();return;}
  if(a==='editvid'){openSheet('editvid',{id:id});return;}
  if(a==='delstory'){remove('stories/'+id,'Story removed');return;}
  if(a==='shot'){var v=S.videos[id],sh=(v.shots||[]).map(function(x){return Object.assign({},x);});sh[+k].done=!sh[+k].done;write('videos/'+id,{shots:sh});return;}
  if(a==='delshot'){var v3=S.videos[id],sh3=(v3.shots||[]).slice();sh3.splice(+k,1);write('videos/'+id,{shots:sh3});return;}
  if(a==='short'){S.ui.shortSel=id;if(!wide()){openSheet('shortview',{id:id});return;}if(route().v!=='shorts')location.hash='#shorts';else render();return;}
  if(a==='shortsrc'){S.ui.shortSrc=k;render();return;}
  if(a==='editshort'){if(S.ui.sheet)closeSheet();openSheet('editshort',{id:id});return;}
  if(a==='delshort'){S.ui.shortSel=null;if(S.ui.sheet)closeSheet();remove('shorts/'+id,'Short deleted');return;}
  if(a==='shortstatus'){write('shorts/'+id,{status:k});return;}
  if(a==='plat'){var s1=S.shorts[id],p=Object.assign({},s1.plat||{});p[k]=!p[k];write('shorts/'+id,{plat:p});return;}
  if(a==='shortchk'){var s2=S.shorts[id],ck=Object.assign({},s2.chk||{});ck[k]=!ck[k];write('shorts/'+id,{chk:ck});return;}
  if(a==='ideakind'){S.ui.ideaKind=k;render();return;}
  if(a==='ideasel'){S.ui.ideaSel=id;render();return;}
  if(a==='delidea'){S.ui.ideaSel=null;remove('ideas/'+id,'Idea deleted');return;}
  if(a==='greenlight'){var i=S.ideas[id];if(!i)return;
    if(i.kind==='essay'){openSheet('greenlight',{id:id});return;}
    if(i.kind==='news'){var nv=deskVideo(today());if(!nv){toast('No upcoming roundup to add it to.');return;}create('stories',{title:i.title,why:i.note||'',segment:'',url:'',video:nv.id,added:today()});write('ideas/'+id,{used:true,video:nv.id},'Added to '+vName(nv));return;}
    var d=nextOpenSlot(addD(today(),1));create('shorts',{title:i.title,date:d,src:'solo',kind:i.kind==='cosplay'?'cosplay':'other',status:'to-film',hook:'',video:'',plat:{yt:true,tt:true,ig:true},chk:{}});write('ideas/'+id,{used:true,usedOn:d},'Short planned for '+fmt(d));return;}
  if(a==='slot'){var i2=S.ideas[id],v4=S.videos[k];var dn=Object.assign({},v4.done||{});dn.greenlight=true;write('videos/'+k,{title:i2.title,idea:id,done:dn,thesis:v4.thesis||''});write('ideas/'+id,{used:true,video:k},'Greenlit for '+fmt(releaseOf(v4)));closeSheet();return;}
  if(a==='answer'){var set=sett(),q=set.questions.filter(function(x){return x.id===id;})[0],ans=Object.assign({},set.answers);ans[id]=(q.options||['Done'])[+k];
    write('config/settings',{answers:ans},'Saved');
    var ap=q.apply&&q.apply[+k];if(ap&&ap.path)write(ap.path,ap.patch);
    return;}
  if(a==='review'){openSheet('review',{day:k});return;}
  if(a==='account'){openSheet('account');return;}
  if(a==='settheme'){lsSet('sbm-theme',k);applyTheme();renderSheet();render();return;}
  if(a==='setpw'){setPassword((document.getElementById('pw-new')||{}).value||'');return;}
  if(a==='revitem'){var dd=t.getAttribute('data-day'),cur=S.checks[dd+'_review']||{},it=Object.assign({},cur.items||{});it[k]=!it[k];var all=REVIEW.every(function(r){return it[r[0]];});put('checks/'+dd+'_review',{items:it,done:all});return;}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var kind=f.getAttribute('data-form');
  if(kind==='shot'){var id=f.getAttribute('data-id'),v=S.videos[id],t=String(new FormData(f).get('t')||'').trim();if(!t)return;write('videos/'+id,{shots:(v.shots||[]).concat([{t:t,done:false}])});return;}
  submitSheet(f);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.ui.sheet)closeSheet();});
window.addEventListener('hashchange',function(){if(S.ui.sheet&&S.ui.sheet.kind!=='review')closeSheet();var r=route();if(r.v==='video'){S.ui.vidSel=r.id;}document.getElementById('view').scrollTop=0;render();});
var mq=window.matchMedia('(min-width:600px)');if(mq.addEventListener)mq.addEventListener('change',render);
if(window.matchMedia){var tq=window.matchMedia('(prefers-color-scheme: dark)');if(tq.addEventListener)tq.addEventListener('change',function(){applyTheme();render();});}
applyTheme();render();start();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
